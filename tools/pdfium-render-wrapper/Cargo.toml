[package]
name = "multi-converter-pdfium-render"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"

[[bin]]
name = "pdfium-render"
path = "src/main.rs"

[dependencies]
image = "0.25.10"
lopdf = "=0.42.0"
pdfium-render = "=0.9.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
