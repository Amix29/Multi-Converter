[package]
name = "mc-offline-ocr"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

[workspace]

[features]
default = []
diagnostics = []

[dependencies]
oar-ocr = { version = "=0.10.2", default-features = false, features = ["simd"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rayon = "1.12"

[patch.crates-io]
oar-ocr = { path = "../../../vendor/oar-ocr" }
oar-ocr-core = { path = "../../../vendor/oar-ocr-core" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
