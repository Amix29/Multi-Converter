name: Native format tests

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string

permissions:
  contents: read

jobs:
  ocr:
    uses: ./.github/workflows/ocr-runtime-staging.yml
    with:
      platform: ${{ inputs.platform }}

  native:
    needs: ocr
    name: Native conversions (${{ inputs.platform }})
    runs-on: ${{ fromJSON('{"windows-x64":"windows-2025","macos-aarch64":"macos-latest","linux-x64":"ubuntu-22.04"}')[inputs.platform] }}
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
      - uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489 # 1.96.0
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ocr-models
          path: ${{ runner.temp }}/ocr-models
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ocr-runtime-${{ inputs.platform }}
          path: ${{ runner.temp }}/ocr-runtime
      - name: Verify the same-run OCR worker and models
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: npm run stage:ocr-runtime-artifacts -- --platform "$PLATFORM" --runtime-dir "$RUNNER_TEMP/ocr-runtime" --models-dir "$RUNNER_TEMP/ocr-models"

      - name: Stage the verified Windows conversion engines
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run prepare:pdfium-engine
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run package:pdfium-engine
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $office = Join-Path $env:RUNNER_TEMP 'format-test-office'
          npm run prepare:bundled-engines -- --asset-dir dist-engines-advanced --test-office-dir $office
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force src-tauri/bundled-engine-profiles/windows-x64 | Out-Null
          New-Item -ItemType Junction -Path src-tauri/bundled-engine-profiles/windows-x64/v3 -Target $office | Out-Null

      - name: Restore the released Linux engines and rebuild current PDFium
        if: runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libdbus-1-dev libssl-dev libxdo-dev librsvg2-dev libfbclient2 xvfb xauth unzip
          asset=Multi-Converter_1.0.6_linux-x64.AppImage
          gh release download v1.0.6 --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && echo "aa743940ed29e7426877f82b54e951681697906a5c1750dca8aee5b973093fce  $asset" | sha256sum -c - && chmod +x "$asset" && "./$asset" --appimage-extract > /dev/null)
          appdir="$RUNNER_TEMP/squashfs-root"
          mkdir -p engine-sources/linux-x64 src-tauri/binaries
          for engine in libreoffice pandoc libvips; do
            source=$(find "$appdir" -type d -path "*/engines/$engine/compatible" -print -quit)
            test -n "$source"
            mv "$source" "engine-sources/linux-x64/$engine"
          done
          for tool in ffmpeg ffprobe; do
            source=$(find "$appdir" -type f \( -name "$tool" -o -name "$tool-x86_64-unknown-linux-gnu" \) -print -quit)
            test -n "$source"
            install -m755 "$source" "src-tauri/binaries/$tool-x86_64-unknown-linux-gnu"
          done
          npm run prepare:pdfium-engine:linux

      - name: Prepare FFmpeg license input
        if: runner.os == 'macOS'
        run: bash scripts/prepare-macos-ffmpeg-licenses.sh

      - name: Stage native Apple Silicon conversion engines
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FFMPEG_MACOS_AARCH64_ARCHIVE_URL: ${{ vars.MC_FFMPEG_MACOS_AARCH64_ARCHIVE_URL }}
          FFMPEG_MACOS_AARCH64_ARCHIVE_SHA256: ${{ vars.MC_FFMPEG_MACOS_AARCH64_ARCHIVE_SHA256 }}
          FFPROBE_MACOS_AARCH64_ARCHIVE_URL: ${{ vars.MC_FFPROBE_MACOS_AARCH64_ARCHIVE_URL }}
          FFPROBE_MACOS_AARCH64_ARCHIVE_SHA256: ${{ vars.MC_FFPROBE_MACOS_AARCH64_ARCHIVE_SHA256 }}
          LIBREOFFICE_MAC_AARCH64_DMG_URL: https://downloadarchive.documentfoundation.org/libreoffice/old/26.2.3.2/mac/aarch64/LibreOffice_26.2.3.2_MacOS_aarch64.dmg
          LIBREOFFICE_MACOS_AARCH64_DMG_SHA256: 8ea6bdf67dbffc9c47104f73a3c98ed145ff26c00dde44c43633f5b3d741479f
          PANDOC_MACOS_AARCH64_ARCHIVE_SHA256: 6e9eca844076bcbb599bbeebbba78a70f93b5307782b85c2c272872812c88875
        run: |
          set -euo pipefail
          npm run prepare:ffmpeg-engine:macos
          npm run prepare:macos-upstream-engines
          brew install vips
          npm run build:libvips-macos-runtime -- --arch aarch64 --output-dir "$RUNNER_TEMP/vips"
          LIBVIPS_MACOS_AARCH64_SOURCE_DIR="$RUNNER_TEMP/vips/runtime-aarch64" npm run prepare:libvips-engine:macos
          mkdir -p src-tauri/binaries
          for tool in ffmpeg ffprobe; do
            install -m755 "engine-sources/macos-aarch64/$tool/bin/$tool-aarch64-apple-darwin" src-tauri/binaries/
          done

      - name: Use the native engine packages for this run
        if: runner.os != 'Windows'
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          host=${PLATFORM%-*}
          npm run "package:$host-engines" -- --release-base-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/"
          directory="dist-engines-$host"
          for engine in libreoffice pandoc pdfium libvips; do
            mkdir -p "src-tauri/bundled-engines/$engine/compatible"
            unzip -q "$directory/$engine-compatible-$PLATFORM.zip" -d "src-tauri/bundled-engines/$engine/compatible"
          done
          echo "MULTI_CONVERTER_ENGINE_MANIFEST=$PWD/$directory/engines-manifest.json" >> "$GITHUB_ENV"

      - name: Run conversions and decoded-content checks
        run: npm run test:conversions
      - name: Retain native format-pair results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: format-pairs-${{ inputs.platform }}
          path: test-results/native-formats/${{ inputs.platform }}.json
          if-no-files-found: error
