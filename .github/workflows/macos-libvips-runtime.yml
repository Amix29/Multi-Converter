name: macOS libvips Runtime

on:
  push:
    branches:
      - codex/test
    paths:
      - ".github/workflows/macos-libvips-runtime.yml"
      - "scripts/build-libvips-macos-runtime.mjs"
  workflow_dispatch:
    inputs:
      output_release_tag:
        description: "Optional test release tag that will receive the libvips runtime archives"
        required: false
        default: ""
        type: string
      arch:
        description: "Runtime architecture to build"
        required: true
        default: "aarch64"
        type: choice
        options:
          - aarch64

permissions:
  contents: write

concurrency:
  group: macos-libvips-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build libvips runtime (${{ matrix.arch }})
    if: ${{ github.event_name == 'workflow_dispatch' || vars.MC_ENABLE_MACOS_LIBVIPS_RUNTIME == '1' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install libvips from Homebrew
        run: |
          set -euo pipefail
          brew update
          brew install vips

      - name: Build portable libvips runtime
        id: libvips
        run: >
          npm run build:libvips-macos-runtime -- --arch "${{ matrix.arch }}"
          --output-dir "$RUNNER_TEMP/mc-libvips-${{ matrix.arch }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libvips-macos-${{ matrix.arch }}
          path: ${{ steps.libvips.outputs.archive }}
          if-no-files-found: error

      - name: Upload libvips runtime to a test release
        if: ${{ inputs.output_release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_RELEASE_TAG: ${{ inputs.output_release_tag }}
        run: |
          set -euo pipefail
          tag="$OUTPUT_RELEASE_TAG"
          if [[ ! "$tag" =~ ^[A-Za-z0-9._/-]+$ || "$tag" == -* || "$tag" == */..* || "$tag" == *..* ]]; then
            echo "Invalid output_release_tag: $tag" >&2
            exit 1
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes "macOS libvips runtime assets for Multi-Converter testing." --prerelease || true
          gh release upload "$tag" "${{ steps.libvips.outputs.archive }}" --repo "$GITHUB_REPOSITORY" --clobber
