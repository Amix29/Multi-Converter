name: Build

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:
    inputs:
      conversion_platform:
        description: Run only the native conversion suite for this host
        type: choice
        options: [full, windows-x64, macos-aarch64, linux-x64, installed-windows]
        default: full
      installer_run_id:
        description: For installed-windows only, retest a verified installer from the same product sources
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.conversion_platform || 'full' }}
  cancel-in-progress: true

jobs:
  conversions:
    if: github.event_name == 'workflow_dispatch' && inputs.conversion_platform != 'full' && inputs.conversion_platform != 'installed-windows'
    uses: ./.github/workflows/native-format-tests.yml
    with:
      platform: ${{ inputs.conversion_platform }}

  quality-gate:
    name: Windows x64 quality gate
    if: github.event_name != 'workflow_dispatch' || inputs.conversion_platform == 'full'
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489 # 1.96.0
        with:
          components: rustfmt, clippy

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v2-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v2-

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: src-tauri/bundled-engines
          key: ${{ runner.os }}-bundled-engines-${{ hashFiles('src-tauri/engines-manifest.json', 'tools/pdfium-windows-x64.lock.json', 'tools/pdfium-render-wrapper/**') }}
          restore-keys: |
            ${{ runner.os }}-bundled-engines-

      - id: cargo-audit-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-audit.exe
          key: ${{ runner.os }}-cargo-audit-bin-v1

      - run: npm ci
      - run: npx playwright install chromium
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.10"
      - name: Build and verify current Windows OCR resources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install uv==0.11.21
          npm run build:ocr-runtime:platform -- --platform windows-x64 --install
          npm run prepare:ocr-runtime -- --platform windows-x64 --output-dir "$RUNNER_TEMP/ocr-runtime-artifact" --verify-reproducible
          npm run prepare:ocr-models -- --allow-download --output-dir "$RUNNER_TEMP/ocr-models"
          npm run stage:ocr-runtime-artifacts -- --platform windows-x64 --runtime-dir "$RUNNER_TEMP/ocr-runtime-artifact" --models-dir "$RUNNER_TEMP/ocr-models"
          npm run inventory:ocr-runtime-licenses
      - name: Prepare source-built native Windows OCR
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install PyYAML==6.0.2 pefile==2023.2.7
          python tools/ocr-runtime/native-worker/download-sources.py --cache "$RUNNER_TEMP/native-ocr-sources"
          python tools/ocr-runtime/native-worker/prepare-microsoft-runtime.py --cache "$RUNNER_TEMP/native-ocr-sources/microsoft"
          python tools/ocr-runtime/native-worker/prepare-models.py --onnx-source "$RUNNER_TEMP/native-ocr-sources/models" --output src-tauri/bundled-engine-profiles/windows-x64/native-v1/ocr/models --shuffle
          export CARGO_TARGET_DIR="$RUNNER_TEMP/mc-native-ocr-target"
          cargo fmt --manifest-path tools/ocr-runtime/native-worker/Cargo.toml -- --check
          cargo build --locked --release --manifest-path tools/ocr-runtime/native-worker/Cargo.toml --bin mc-offline-ocr
          cargo test --locked --release --manifest-path tools/ocr-runtime/native-worker/Cargo.toml --bin mc-offline-ocr
          cargo clippy --locked --release --manifest-path tools/ocr-runtime/native-worker/Cargo.toml --all-targets -- -D warnings
          npm run prepare:windows-native-ocr -- --write-lock --worker "$CARGO_TARGET_DIR/release/mc-offline-ocr.exe" --ort-source "$RUNNER_TEMP/native-ocr-sources/onnxruntime" --microsoft-source "$RUNNER_TEMP/native-ocr-sources/microsoft"
          npm run prepare:windows-native-ocr -- --check
          python tools/ocr-runtime/native-worker/audit-runtime-imports.py --runtime src-tauri/bundled-engine-profiles/windows-x64/native-v1/ocr/runtime/windows-x64 --report tmp/native-ocr-imports-ci.json
          python tools/ocr-runtime/native-worker/test-lifecycle.py --worker src-tauri/bundled-engine-profiles/windows-x64/native-v1/ocr/runtime/windows-x64/ocr-worker.exe --models src-tauri/bundled-engine-profiles/windows-x64/native-v1/ocr/models --report tmp/native-ocr-lifecycle-ci.json
      - run: cargo install cargo-audit --locked
        if: steps.cargo-audit-cache.outputs.cache-hit != 'true'
      - run: npm run test:windows:ci

      - name: Verify the Windows installer payload
        id: installer
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $name = "Multi-Converter_${version}_x64-setup.exe"
          $bundle = Join-Path ([IO.Path]::GetTempPath()) 'mc-cargo-target-tauri-dev/release/bundle/nsis'
          $installer = Get-Item -LiteralPath (Join-Path $bundle $name)
          if ($installer.Length -gt 350000000) { throw 'Installer exceeds the 350 MB limit' }
          $out = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'verified-installer')
          npm run verify:windows-engine-package -- --installer $installer.FullName --report "$out/payload.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath $installer.FullName -Destination $out.FullName
          $sha = (Get-FileHash -LiteralPath "$out/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne (Get-Content -Raw "$out/payload.json" | ConvertFrom-Json).installerSha256) {
            throw 'Installer differs from verified payload'
          }
          Set-Content -LiteralPath "$out/$name.sha256" -Value "$sha  $name" -Encoding ascii
          "dir=$($out.FullName)" >> $env:GITHUB_OUTPUT
      - name: Retain the verified Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-windows-x64-installer
          path: ${{ steps.installer.outputs.dir }}
          if-no-files-found: error
          compression-level: 0

      - name: Retain native format-pair results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: format-pairs-windows-x64
          path: test-results/native-formats/windows-x64.json
          if-no-files-found: error

  installed-windows:
    name: Install and exercise the verified Windows package
    needs: quality-gate
    if: ${{ !cancelled() && (needs.quality-gate.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.conversion_platform == 'installed-windows')) }}
    permissions:
      contents: read
      actions: read
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false
          fetch-depth: ${{ inputs.conversion_platform == 'installed-windows' && '0' || '1' }}
      - name: Validate the source of the existing installer
        if: inputs.conversion_platform == 'installed-windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.installer_run_id }}
        run: |
          if ($env:SOURCE_RUN -notmatch '^[0-9]+$') { throw 'Supply a numeric installer_run_id' }
          $source = gh run view $env:SOURCE_RUN --json event,workflowName,headBranch,headSha,jobs | ConvertFrom-Json
          if ($source.event -ne 'push' -or $source.workflowName -ne 'Build' -or $source.headBranch -ne $env:GITHUB_REF_NAME) { throw 'Unexpected installer source' }
          if (@($source.jobs | Where-Object { $_.name -eq 'Windows x64 quality gate' -and $_.conclusion -eq 'success' }).Count -ne 1) { throw 'Installer verification did not pass' }
          git diff --quiet $source.headSha $env:GITHUB_SHA -- . ':(exclude).github/workflows/build.yml' ':(exclude)scripts/test-installed-windows-ocr.mjs'
          if ($LASTEXITCODE) { throw 'The installer and current product sources differ' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-windows-x64-installer
          run-id: ${{ inputs.conversion_platform == 'installed-windows' && inputs.installer_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-installer
      - name: Verify the download, install silently and exercise the installed OCR worker
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'verified-installer'
          $payload = Get-Content -LiteralPath "$dir/payload.json" -Raw | ConvertFrom-Json
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $installer = Get-Item -LiteralPath "$dir/Multi-Converter_${version}_x64-setup.exe"
          if ((Get-FileHash -LiteralPath $installer.FullName).Hash -ne $payload.installerSha256) {
            throw 'Downloaded NSIS fingerprint changed'
          }
          $install = Join-Path $env:RUNNER_TEMP 'installed-converter'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$install") -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw "NSIS exited with $($setup.ExitCode)" }
          if ((Get-FileHash -LiteralPath "$install/multi-converter.exe").Hash -ne $payload.applicationBinary.sha256) {
            throw 'Installed application fingerprint changed'
          }
          python tools/ocr-runtime/native-worker/test-lifecycle.py --worker "$install/ocr/native-v1/runtime/windows-x64/ocr-worker.exe" --models "$install/ocr/native-v1/models" --report "$dir/installed-ocr.json"
      - name: Exercise the installed app on a clean install, after an upgrade and with a damaged active DLL
        shell: pwsh
        env:
          MC_TEST_WEBVIEW_PORT: 19222
        run: |
          # Elevated WebView2 hosts can ignore environment browser arguments.
          # Scope the loopback test port to this executable on the ephemeral runner.
          $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name 'multi-converter.exe' -PropertyType String -Force -Value "--remote-debugging-address=127.0.0.1 --remote-debugging-port=$env:MC_TEST_WEBVIEW_PORT" | Out-Null
          $dir = Join-Path $env:RUNNER_TEMP 'verified-installer'
          $install = Join-Path $env:RUNNER_TEMP 'installed-converter'
          $exe = Join-Path $install 'multi-converter.exe'
          node scripts/test-installed-windows-ocr.mjs $exe "$dir/app-clean.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          # Reproduce an upgrade in place with unowned files left by the Python runtime.
          $legacy = Join-Path $install 'ocr/runtime/windows-x64/_internal/api-ms-win-core-console-l1-1-0.dll'
          New-Item -ItemType Directory -Force (Split-Path $legacy) | Out-Null
          Set-Content -LiteralPath $legacy -Value 'synthetic legacy DLL from a different build'
          New-Item -ItemType Directory -Force "$install/ocr/models" | Out-Null
          Set-Content -LiteralPath "$install/ocr/models/legacy.yml" -Value 'old model metadata'
          $installer = Get-Item "$dir/Multi-Converter_*_x64-setup.exe"
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$install") -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw "Upgrade failed ($($setup.ExitCode))" }
          if (!(Test-Path -LiteralPath $legacy)) { throw 'Missing legacy regression fixture' }
          node scripts/test-installed-windows-ocr.mjs $exe "$dir/app-upgrade.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          # Change one byte without changing the size. A new app process must reject it before inference.
          $active = Join-Path $install 'ocr/native-v1/runtime/windows-x64/onnxruntime.dll'
          $stream = [IO.File]::Open($active, 'Open', 'ReadWrite', 'None')
          try {
            $stream.Position = $stream.Length - 1
            $original = $stream.ReadByte()
            $stream.Position = $stream.Length - 1
            $stream.WriteByte($original -bxor 1)
          } finally { $stream.Dispose() }
          node scripts/test-installed-windows-ocr.mjs $exe "$dir/app-tamper.json" 'Ressource OCR modifiée: onnxruntime.dll'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installed-windows-ocr-receipt
          path: |
            ${{ runner.temp }}/verified-installer/installed-ocr.json
            ${{ runner.temp }}/verified-installer/app-*.json
            ${{ runner.temp }}/verified-installer/app-clean-*.png
          if-no-files-found: error

  macos-code-check:
    if: github.event_name != 'workflow_dispatch' || inputs.conversion_platform == 'full'
    name: macOS code check (${{ matrix.rust-target }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rust-target:
          - aarch64-apple-darwin
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MULTI_CONVERTER_CARGO_TARGET_NAME: mc-cargo-target-${{ matrix.rust-target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489 # 1.96.0
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust-target }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.rust-target }}-cargo-registry-v2-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rust-target }}-cargo-registry-v2-
            ${{ runner.os }}-cargo-registry-v2-

      - run: npm ci
      - run: npm run validate:embedded-manifest
      - run: npm run validate:i18n
      - run: npm run typecheck
      - run: npm run test:release-notes
      - run: npm run test:macos-packaging
      - run: npm run test:github-workflows
      - run: npm run test:release-assets
      - run: npm run test:bundled-engines-platform
      - run: npm run test:ui-layout
      - run: npm run test:repository-metadata
      - run: npm run test:run-tauri
      - run: npm run fmt:rust:check
      - run: node scripts/prepare-tauri-ci-sidecars.mjs --target ${{ matrix.rust-target }}
      - run: node scripts/cargo-test-temp.mjs check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rust-target }}
      - run: node scripts/cargo-test-temp.mjs clippy --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rust-target }} --all-targets -- -D warnings

  macos-host-tests:
    if: github.event_name != 'workflow_dispatch' || inputs.conversion_platform == 'full'
    name: macOS host unit tests
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MULTI_CONVERTER_CARGO_TARGET_NAME: mc-cargo-target-macos-host-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489 # 1.96.0
        with:
          components: rustfmt, clippy

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-host-tests-cargo-registry-v2-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-host-tests-cargo-registry-v2-
            ${{ runner.os }}-cargo-registry-v2-

      - run: npm ci
      - run: node scripts/prepare-tauri-ci-sidecars.mjs --target host
      - run: npm run test:rust
      - run: npm run test:pdfium-wrapper:compile
      - run: npm run clippy:pdfium-wrapper

  linux-code-check:
    if: github.event_name != 'workflow_dispatch' || inputs.conversion_platform == 'full'
    name: Linux x64 code check
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      MULTI_CONVERTER_CARGO_TARGET_NAME: mc-cargo-target-linux-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489 # 1.96.0
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libssl-dev \
            libxdo-dev \
            librsvg2-dev \
            libfbclient2 \
            build-essential \
            pkg-config \
            patchelf

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-linux-x64-cargo-registry-v2-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-linux-x64-cargo-registry-v2-
            ${{ runner.os }}-cargo-registry-v2-

      - run: npm ci
      - run: npm run test:linux:ci
