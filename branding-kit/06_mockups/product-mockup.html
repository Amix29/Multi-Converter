<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Multi-Converter Product Mockup</title><style>:root{--bg:#f5f3ec;--paper:#fffdf7;--ink:#1d241f;--muted:#70766f;--line:#ded9cc;--line-strong:#c6c0b4;--accent:#3f7664;--accent-soft:#e5f0eb;--orange:#c86a34;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(rgba(29,36,31,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(29,36,31,.045) 1px,transparent 1px),var(--bg);background-size:24px 24px;color:var(--ink)}.window{width:min(980px,calc(100vw - 38px));border:1px solid var(--line-strong);border-radius:26px;background:var(--paper);box-shadow:0 18px 54px rgba(29,36,31,.08);overflow:hidden}.top{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 18px}.dot{width:10px;height:10px;border-radius:50%;background:var(--orange)}.dot:nth-child(2){background:#d9b45f}.dot:nth-child(3){background:var(--accent)}.body{padding:34px;display:grid;grid-template-columns:1.1fr .9fr;gap:24px}.drop{border:1px dashed #b8b2a6;border-radius:22px;padding:46px 24px;text-align:center;background:rgba(255,253,247,.8)}h1{font-size:44px;line-height:.95;margin:0 0 10px;font-weight:950}.lead{color:var(--muted);font-size:18px}.btn{display:inline-flex;margin-top:18px;min-height:48px;align-items:center;padding:0 18px;border-radius:8px;background:var(--ink);color:var(--paper);font-weight:950;box-shadow:4px 5px 0 rgba(29,36,31,.22)}.side{display:grid;gap:12px}.file{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fffaf0;font-weight:850}.file span{color:var(--muted);font-size:13px}.done{border-color:var(--accent);background:var(--accent-soft)}.note{width:max-content;transform:rotate(-2deg);padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fffaf0;color:#986853;font-weight:850}@media(max-width:760px){.body{grid-template-columns:1fr}h1{font-size:34px}}</style></head><body><main class="window"><div class="top"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><section class="body"><div class="drop"><h1>Déposez. Sélectionnez. Récupérez.</h1><p class="lead">Convertissez vos fichiers depuis votre PC, sans compte et sans upload obligatoire.</p><span class="btn">Ajouter des fichiers</span></div><aside class="side"><div class="file">rapport.pdf <span>PDF → HTML</span></div><div class="file">data.csv <span>CSV → JSON</span></div><div class="file done">image.png <span>PNG → WebP · terminé</span></div><span class="note">traitement local</span></aside></section></main></body></html>
