<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Multi-Converter Brand Board</title>
<style>
:root{--bg:#f8f2e9;--paper:#fffdf8;--ink:#23201c;--muted:#746d63;--line:rgba(35,32,28,.13);--line-soft:rgba(35,32,28,.07);--accent:#c86a34;--font:"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;color:var(--ink);background:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px),radial-gradient(circle at 41% 48%,rgba(200,106,52,.085),transparent 20%),var(--bg);background-size:32px 32px,32px 32px,auto,auto;font-family:var(--font)}.board{position:relative;width:min(1040px,calc(100vw - 48px));min-height:560px;display:grid;place-items:center;overflow:hidden}.board:before{content:"";position:absolute;inset:54px 74px;border:1px solid var(--line);border-radius:8px;opacity:.55}.axis-x,.axis-y{position:absolute;background:var(--line);opacity:.55}.axis-x{left:96px;right:96px;top:50%;height:1px}.axis-y{top:78px;bottom:78px;left:36%;width:1px}.lockup{position:relative;z-index:1;display:flex;align-items:center;gap:30px;transform:translateY(4px)}svg{width:118px;height:118px}.copy h1{margin:0;color:var(--ink);font-size:clamp(54px,7vw,86px);line-height:.9;font-weight:850;letter-spacing:0}.copy p{width:fit-content;margin:12px 0 0;padding-top:10px;border-top:2px solid var(--accent);color:var(--muted);font-size:14px;font-weight:750}.note{position:absolute;z-index:1;color:var(--muted);font-size:12px;font-weight:750}.note.top{top:106px;right:140px}.note.bottom{left:132px;bottom:108px}.corner{position:absolute;width:26px;height:26px;border-color:var(--ink);opacity:.24}.tl{top:54px;left:74px;border-top:2px solid;border-left:2px solid}.br{right:74px;bottom:54px;border-right:2px solid;border-bottom:2px solid}@media(max-width:720px){.board{width:min(460px,calc(100vw - 32px));min-height:620px}.lockup{flex-direction:column;text-align:center}.copy h1{font-size:46px}.copy p{margin-inline:auto}}
</style>
</head>
<body>
<main class="board" aria-label="Identité visuelle Multi-Converter"><span class="axis-x"></span><span class="axis-y"></span><span class="corner tl"></span><span class="corner br"></span><span class="note top">paper / ink / accent</span><span class="note bottom">conversion workspace</span><section class="lockup"><svg viewBox="0 0 44 44" role="img" aria-label="Logo Multi-Converter"><g transform="translate(2 1.5) rotate(-1.5 19 19)"><rect x="3" y="3" width="38" height="38" rx="8" fill="#23201c" opacity="0.1"/><rect x="0" y="0" width="38" height="38" rx="8" fill="#fffdf8" stroke="#23201c" stroke-width="1.5"/><rect x="9.5" y="18" width="19" height="2" rx="1" fill="#23201c"/><rect x="18" y="9.5" width="2" height="19" rx="1" fill="#23201c"/><circle cx="27" cy="27.6" r="3.8" fill="#c86a34"/></g></svg><div class="copy"><h1>Multi-Converter</h1><p>simple file conversion</p></div></section></main>
</body>
</html>
